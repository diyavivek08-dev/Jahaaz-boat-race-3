<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JAHAAZ - Quiz Checkpoints</title>
  <style>
    :root {
      --bg-dark: #030b1e;
      --bg-card: rgba(10, 25, 47, 0.85);
      --accent-cyan: #00f2fe;
      --accent-blue: #4facfe;
      --text-light: #e6f1ff;
      --text-dim: #8892b0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #0a192f 0%, #020c1b 100%);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: var(--bg-card);
      border: 1px solid rgba(0, 242, 254, 0.2);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 20px rgba(0, 242, 254, 0.15);
      border-radius: 16px;
      padding: 40px 30px;
      width: 100%;
      max-width: 600px;
      text-align: center;
      backdrop-filter: blur(8px);
    }

    h1.title {
      font-size: 2.8rem;
      letter-spacing: 5px;
      color: var(--accent-cyan);
      text-shadow: 0 0 15px rgba(0, 242, 254, 0.6);
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    p.subtitle {
      color: var(--text-dim);
      font-size: 1.05rem;
      margin-bottom: 30px;
    }

    .checkpoint-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    .cp-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(0, 242, 254, 0.25);
      padding: 20px;
      border-radius: 12px;
      text-decoration: none;
      color: var(--text-light);
      font-weight: bold;
      font-size: 1.1rem;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .cp-card:hover {
      background: rgba(0, 242, 254, 0.15);
      border-color: var(--accent-cyan);
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(0, 242, 254, 0.2);
    }

    .cp-number {
      font-size: 1.5rem;
      color: var(--accent-cyan);
    }
  </style>
</head>
<body>

<div class="container">
  <h1 class="title">JAHAAZ</h1>
  <p class="subtitle">Select a Checkpoint to start your ocean quest</p>

  <div class="checkpoint-grid">
    <a href="checkpoint1.html" class="cp-card">
      <span class="cp-number">Checkpoint 1</span>
      <span>Start Challenge</span>
    </a>
    <a href="checkpoint2.html" class="cp-card">
      <span class="cp-number">Checkpoint 2</span>
      <span>Start Challenge</span>
    </a>
    <a href="checkpoint3.html" class="cp-card">
      <span class="cp-number">Checkpoint 3</span>
      <span>Start Challenge</span>
    </a>
    <a href="checkpoint4.html" class="cp-card">
      <span class="cp-number">Checkpoint 4</span>
      <span>Start Challenge</span>
    </a>
    <a href="checkpoint5.html" class="cp-card">
      <span class="cp-number">Checkpoint 5</span>
      <span>Start Challenge</span>
    </a>
    <a href="checkpoint6.html" class="cp-card">
      <span class="cp-number">Checkpoint 6</span>
      <span>Start Challenge</span>
    </a>
  </div>
</div>

</body>
</html>
